name: Update Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'recommenders/**/*.py'

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    # Repositories without a Pages site can build the same HTML locally.
    if: github.event.repository.has_pages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r docs/requirements-doc.txt
      - run: jupyter-book build docs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the built HTML
        id: publish
        uses: actions/deploy-pages@v4
